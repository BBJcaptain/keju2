name: Keju Scraper A (:07)

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
  push:
    branches: [ main ]

concurrency:
  group: keju-scraper
  cancel-in-progress: false

jobs:
  fetch-prices:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 yfinance

    - name: Pull latest changes
      run: git pull origin main

    - name: Fetch gold prices
      run: |
        python fetch_gold_prices.py

    - name: Commit and push if changed
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add gold_prices.json history_2026.json data/
        git diff --quiet && git diff --staged --quiet || (git commit -m "Update gold prices - $(date -u '+%Y-%m-%d %H:%M:%S UTC')" && git push)
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
